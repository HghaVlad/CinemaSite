version: "3.1"

services:
    backend:
        container_name: apisite
        build: .
        ports:
            - "8000:8000"
        depends_on:
            - db
        env_file:
            - .env
        environment:
            DATABASE_URL: "postgresql+asyncpg://postgres:postgres@db:5432/postgres"

    db:
        image: postgres:15
        container_name: postgres_db
        restart: always
        env_file:
            - .env
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data: