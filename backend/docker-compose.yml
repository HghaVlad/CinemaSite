version: "3.1"

services:
    backend:
        container_name: apisite
        build: .
        ports:
            - "8000:8000"
        depends_on:
            db:
                condition: service_healthy
        env_file:
            - .env
        environment:
            - postgres_host=db

    db:
        image: postgres:15
        container_name: postgres_db
        restart: always
        env_file:
            - .env
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data: